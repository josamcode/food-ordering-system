<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.ico" />
    <title>Product — Foodie</title>
    <meta name="description" content="Dish details on Foodie." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="navbar" data-navbar>
      <div class="container navbar__inner">
        <a href="index.html" class="brand" aria-label="Foodie home">
          <img src="images/logo.png" alt="" class="brand__mark" />
          <span class="brand__name">Food<em>ie</em></span>
        </a>

        <nav class="nav__links" aria-label="Main">
          <a href="index.html" class="nav__link">Home</a>
          <a href="index.html#menu" class="nav__link is-active">Menu</a>
          <a href="cart.html" class="nav__link">Cart</a>
          <a href="orders.html" class="nav__link">Orders</a>
          <a href="checkout.html" class="nav__link">Checkout</a>
        </nav>

        <div class="nav__actions">
          <a href="cart.html" class="cart-button" aria-label="Open cart">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="9" cy="21" r="1" />
              <circle cx="20" cy="21" r="1" />
              <path
                d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"
              />
            </svg>
            <span>Cart</span>
            <span class="cart-button__count" data-cart-count>0</span>
          </a>
          <button
            class="nav__toggle"
            data-nav-toggle
            aria-label="Open menu"
            type="button"
          >
            <span></span>
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="section section--top">
        <div class="container" data-product-root></div>
      </section>

      <section class="section related" data-related>
        <div class="container">
          <div class="section-head">
            <div class="section-head__intro">
              <span class="eyebrow">You might also like</span>
              <h2>More from this kitchen.</h2>
            </div>
          </div>
          <div class="related__grid" data-related-grid></div>
        </div>
      </section>
    </main>

    <footer class="page_footer">
      <div class="container">
        <div class="footer__bottom">
          <span>© 2026 Foodie.</span>
          <span>Privacy · Terms · Cookies</span>
        </div>
      </div>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
    <script src="js/product.js"></script>
  </body>
</html>
