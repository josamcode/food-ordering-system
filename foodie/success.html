<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.ico" />
    <title>Order confirmed — Foodie</title>
    <meta name="description" content="Your Foodie order is confirmed." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="navbar" data-navbar>
      <div class="container navbar__inner">
        <a href="index.html" class="brand" aria-label="Foodie home">
          <img src="images/logo.png" alt="" class="brand__mark" />
          <span class="brand__name">Food<em>ie</em></span>
        </a>

        <nav class="nav__links" aria-label="Main">
          <a href="index.html" class="nav__link">Home</a>
          <a href="index.html#menu" class="nav__link">Menu</a>
          <a href="cart.html" class="nav__link">Cart</a>
          <a href="orders.html" class="nav__link">Orders</a>
          <a href="checkout.html" class="nav__link">Checkout</a>
        </nav>

        <div class="nav__actions">
          <a href="cart.html" class="cart-button" aria-label="Open cart">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="9" cy="21" r="1" />
              <circle cx="20" cy="21" r="1" />
              <path
                d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"
              />
            </svg>
            <span>Cart</span>
            <span class="cart-button__count" data-cart-count>0</span>
          </a>
          <button
            class="nav__toggle"
            data-nav-toggle
            aria-label="Open menu"
            type="button"
          >
            <span></span>
          </button>
        </div>
      </div>
    </header>

    <main>
      <section class="success">
        <div class="success__card" data-success-card>
          <div class="success__icon" aria-hidden="true">
            <svg
              width="40"
              height="40"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="20 6 9 17 4 12" />
            </svg>
          </div>
          <h1>Your order is on its way.</h1>
          <p data-success-message>
            Thanks for ordering with Foodie. Our kitchen is firing things up —
            you'll hear from your rider shortly.
          </p>

          <div class="success__order" data-success-order></div>

          <div class="success__cta">
            <a class="btn btn--primary btn--lg" href="orders.html"
              >View my orders</a
            >
            <a class="btn btn--secondary btn--lg" href="index.html#menu"
              >Back to menu</a
            >
          </div>
        </div>
      </section>
    </main>

    <footer class="page_footer">
      <div class="container">
        <div class="footer__bottom">
          <span>© 2026 Foodie.</span>
          <span>Privacy · Terms · Cookies</span>
        </div>
      </div>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
    <script>
      /* Inline because it's a tiny page-specific snippet:
       read the most recent order from localStorage and
       paint a small recap on the success card. */
      (function renderSuccess() {
        const orderEl = document.querySelector("[data-success-order]");
        const msgEl = document.querySelector("[data-success-message]");
        try {
          const raw = localStorage.getItem(ORDER_KEY);
          if (!raw) {
            if (orderEl) orderEl.style.display = "none";
            return;
          }
          const order = JSON.parse(raw);

          if (msgEl && order.customer && order.customer.name) {
            msgEl.textContent =
              `Thanks ${order.customer.name.split(" ")[0]}, your order is confirmed. ` +
              `Estimated delivery: about 30 minutes.`;
          }

          const itemCount = order.items.reduce((s, i) => s + i.qty, 0);
          const deliveryLabel = order.freeDelivery
            ? `<strong class="free-pill">Free delivery</strong>`
            : `<strong>${formatPrice(order.delivery || 0)}</strong>`;

          orderEl.innerHTML = `
          <div class="success__order-row"><span>Order ID</span><strong>${order.id}</strong></div>
          <div class="success__order-row"><span>Customer</span><strong>${order.customer.name}</strong></div>
          <div class="success__order-row"><span>Items</span><strong>${itemCount}</strong></div>
          <div class="success__order-row"><span>Payment</span><strong>${order.payment}</strong></div>
          <div class="success__order-row"><span>Subtotal</span><strong>${formatPrice(order.subtotal || 0)}</strong></div>
          <div class="success__order-row"><span>Delivery</span>${deliveryLabel}</div>
          <div class="success__order-row"><span>Delivery to</span><strong>${order.customer.address}</strong></div>
          <div class="success__order-row success__order-row--total"><span>Total paid</span><strong>${formatPrice(order.total)}</strong></div>
        `;
        } catch (err) {
          console.warn("Could not load last order", err);
          if (orderEl) orderEl.style.display = "none";
        }
      })();
    </script>
  </body>
</html>
